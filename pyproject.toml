# The workspace root. It is not a package itself: the code lives in three
# members that share one lockfile and one venv.
#
#   core/  reefscanner-core  detection engine and CLI, no web dependencies
#   edge/  reefscanner-edge  the headless on-rig agent (v3)
#   app/   reefscanner-app   the field app: local service, review UI, desktop shell
#
# Splitting them keeps the rig from installing the web stack, and the laptop
# from installing board runtimes. See docs/specs/v3/spec.md.

[tool.uv.workspace]
members = ["core", "edge", "app"]

# The dev group pulls in every member (editable), so a plain `uv sync` sets up
# the whole repo with the test suite.
[dependency-groups]
dev = [
    "reefscanner-core[ml]",
    "reefscanner-edge",
    "reefscanner-app[desktop]",
    "pytest>=7.4",
    "httpx>=0.27",          # FastAPI TestClient transport
    "imageio-ffmpeg>=0.4.9",
    # Validating written Camtrap DP packages in the tests, offline.
    "frictionless>=5.18,<6",
    "jsonschema>=4.20",
]

[tool.uv.sources]
reefscanner-core = { workspace = true }
reefscanner-edge = { workspace = true }
reefscanner-app = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
