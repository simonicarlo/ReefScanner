[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefscanner"
version = "2.0.0.dev0"
description = "Local desktop app for triaging static-camera (BRUV) underwater video for marine megafauna."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ReefScanner contributors" }]
keywords = ["marine", "bruv", "motion-detection", "video", "triage", "opencv", "desktop"]

# The analysis engine. No web stack in here -- `pip install reefscanner` still
# gives you a working CLI, and the engine's own import stays light regardless
# (detector construction is lazy, so `import reefscanner` does not pull in
# torch until a detector is actually built).
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "tqdm>=4.65,<5",
    "PyYAML>=6.0,<7",
    # The detector is no longer optional: motion-only recall was removed, so an
    # install without these can't scan anything. NOTE: Ultralytics YOLO is
    # AGPL-3.0 (copyleft, network clause) -- fine for research and internal use;
    # see docs/model-research.md before distributing.
    "ultralytics>=8.1,<9",
    "torch>=2.0",
    # SharkTrack's checkpoint was saved by an older Ultralytics and needs dill to
    # unpickle. Ultralytics would try to pip-install it at load time, which fails
    # in any venv without pip.
    "dill>=0.3",
]

[project.optional-dependencies]
# The local service: `reefscanner serve` and the review UI's backend.
app = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<0.1",
    "python-multipart>=0.0.9",
]
# The native window. Adds nothing the service needs — `serve` works without it.
desktop = [
    "reefscanner[app]",
    "pywebview>=5.1,<6",
]
# Kept so `pip install 'reefscanner[ml]'` keeps working; these are core now.
ml = ["sahi>=0.11"]   # tiled inference for distant/small animals (MIT)
# ffmpeg fallback for environments without a system binary.
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
dev = [
    "reefscanner[app]",
    "pytest>=7.4",
    "httpx>=0.27",          # FastAPI TestClient transport
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
reefscanner = "reefscanner.cli:main"

[project.urls]
Homepage = "https://github.com/simonicarlo/reefscanner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The built React app ships inside the wheel so the desktop shell is self-contained.
"reefscanner.app" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
