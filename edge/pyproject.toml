[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reefscanner-edge"
version = "3.0.0.dev0"
description = "ReefScanner's headless on-rig agent: films, detects and keeps the clips worth reviewing."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ReefScanner contributors" }]
# Everything the agent needs (OpenCV, ONNX Runtime, PyYAML, the Camtrap DP
# tables) comes with core. It also needs an ffmpeg binary with libx264 for the
# ring buffer: the system's, or core's `ffmpeg` extra.
dependencies = ["reefscanner-core"]

[project.scripts]
reefscanner-edge = "reefscanner.edge.cli:main"

[tool.uv.sources]
reefscanner-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reefscanner"]
