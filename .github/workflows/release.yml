# Build, sign and notarize the Mac app, and publish it as a GitHub release.
#
# A `v*` tag (e.g. v1.0.1, matching app/scripts/set_version.sh) creates the
# release. Running it by hand ("Run workflow") builds the same thing and only
# keeps it as a workflow artifact, for trying a build before tagging.
# See docs/specs/v3/features/2026-11-18-distribution-design.md and
# 2026-11-18-self-update-design.md (the Velopack files the app updates from).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commits: this job holds the signing keychain and the
# notary key, so a moved tag upstream must not be able to change what runs.
jobs:
  macos:
    runs-on: macos-15  # Apple Silicon
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing pushes with git; keep the token out of .git/config

      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' app/pyproject.toml)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but app/pyproject.toml says $have. Run app/scripts/set_version.sh $want first."
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Velopack CLI
        # The same version as the velopack package in uv.lock, which the app
        # runs with: Velopack needs both sides to match (build_app.sh checks).
        run: |
          version="$(awk '/^name = "velopack"$/ { getline; print }' uv.lock \
            | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [ -z "$version" ]; then echo "::error::No velopack in uv.lock"; exit 1; fi
          dotnet tool install vpk --version "$version" --tool-path "$RUNNER_TEMP/vpk"
          echo "VPK=$RUNNER_TEMP/vpk/vpk" >> "$GITHUB_ENV"

      - name: Signing keychain and notary key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12"
            exit 1
          fi

          key_path="$RUNNER_TEMP/notary_key.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key_path"
          # vpk notarizes through a notarytool profile; keep it in the
          # throwaway keychain, so it goes when the keychain does.
          xcrun notarytool store-credentials reefscanner-notary \
            --key "$key_path" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain"
          {
            echo "REEFSCANNER_SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$key_path"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            echo "VPK_NOTARY_PROFILE=reefscanner-notary"
            echo "VPK_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          VPK_PREVIOUS_FROM: https://github.com/${{ github.repository }}
        run: app/scripts/build_app.sh

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ReefScanner-macOS
          path: |
            app/dist/ReefScanner.dmg
            app/dist/velopack/
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease";; esac
          # People get the DMG; the app reads the feed and this version's
          # packages. The previous release's full package, fetched for the
          # delta, and Velopack's portable zip stay out.
          version="${GITHUB_REF_NAME#v}"
          files=(app/dist/ReefScanner.dmg app/dist/velopack/releases.osx.json
                 "app/dist/velopack/ReefScanner-$version-osx-full.nupkg")
          delta="app/dist/velopack/ReefScanner-$version-osx-delta.nupkg"
          [ -f "$delta" ] && files+=("$delta")
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "ReefScanner ${GITHUB_REF_NAME#v}" --generate-notes $prerelease \
            $([ -z "$prerelease" ] && echo --latest)

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8"
